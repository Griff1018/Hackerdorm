<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Post Preview — simulated</title>
<style>body{font-family:system-ui,sans-serif;background:#f7f3eb;color:#17202a;margin:0}.top{background:#263b32;color:#fff;padding:20px 6vw}.wrap{max-width:900px;margin:24px auto;padding:0 18px}.notice,.card{background:#fff;border:1px solid #ded6c8;border-radius:14px;padding:18px;margin:14px 0}.notice{background:#fff3bd;font-weight:700}.meta{color:#667066;font-size:13px}.badge{background:#d9efe2;color:#17452b;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}.card h2{margin-bottom:4px}.quote{font-size:18px;line-height:1.5}.empty{color:#875000}</style></head>
<body><header class="top"><h1>Campus Crumb</h1><p>Social post preview <span class="badge">PROTOTYPE</span> · SYNTHETIC DATA</p></header>
<main class="wrap"><div class="notice">SIMULATED — not a real platform. Preview only; nothing is posted. No likes, comments, followers, reviews, or ratings are shown.</div><p id="state" class="empty">Loading the latest draft campaign...</p><section id="feed"></section><p><a href="index.html">Back to Enterprise Buddy Demo Mode</a></p></main>
<script>fetch('../data/output/social_feed_preview.json').then(r=>r.json()).then(data=>{document.getElementById('state').textContent='Drafts loaded from data/output/social_feed_preview.json.';document.getElementById('feed').innerHTML=data.posts.map(x=>`<article class="card"><div class="meta">${x.day} · ${x.platform} · DRAFT ONLY</div><h2>Campus Crumb post preview</h2><p class="quote">${x.caption}</p><p>${x.hashtags}</p><div class="meta">Image brief: plain campus table; no real customer faces.</div></article>`).join('')}).catch(()=>{document.getElementById('state').textContent='Draft campaign could not be read. This visible failure is not replaced with fake content.'});</script></body></html>
