    // =====================================================================
    // HELPERS
    // =====================================================================
    function load(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
    }
    // If uploaded images overflow storage, keep the newest post's image and drop older uploaded ones
    function savePosts(posts) {
      if (save(LS.posts, posts)) return;
      save(LS.posts, posts.map((p, i) => (i > 0 && p.media?.startsWith("data:") ? { ...p, media: "" } : p)));
    }

    function timeAgo(ts) {
      const s = Math.max(0, (Date.now() - ts) / 1000);
      if (s < 60) return "Just now";
      if (s < 3600) return `${Math.floor(s / 60)}m`;
      if (s < 86400) return `${Math.floor(s / 3600)}h`;
      if (s < 7 * 86400) return `${Math.floor(s / 86400)}d`;
      return `${Math.floor(s / (7 * 86400))}w`;
    }
    const fmt = (n) => Number(n).toLocaleString();
    const initials = (name = "") => name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    const stripHash = (t) => String(t).trim().replace(/^#+/, "").replace(/\s+/g, "");
    const uniq = (arr) => [...new Set(arr.filter(Boolean))];

    // Downscale uploads so they fit in localStorage
    function readImageFile(file, maxW = 1200) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) return reject(new Error("Please choose an image file"));
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Could not read that file"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("Could not read that image"));
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.85));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // =====================================================================
    // AI: TALENT & CONTENT AGENT (OpenAI → server .env proxy → mock fallback)
    // =====================================================================
    const AGENT_PROMPT = `You are the Talent & Content Agent for ${COMPANY.name} (${COMPANY.industry}, ${COMPANY.location}): ${COMPANY.tagline}.
Write a high-conversion LinkedIn job announcement optimized for LinkedIn algorithm reach and SEO.
Rules:
- "hook": one scroll-stopping first line under 150 characters (LinkedIn truncates around 210 characters).
- "body": short paragraphs separated by blank lines, 3-6 bullet points that start with a professional emoji, a line with location and work arrangement, and a clear call to action (Easy Apply, comment, or tag someone). Do not repeat the hook. Do not include hashtags.
- Match the requested tone.
Respond ONLY with JSON:
{"hook": string, "body": string, "salary": "estimated monthly range in the local currency of the location, e.g. RM 8,000 – 12,000 / month", "experience": "seniority and years, e.g. Mid-Senior · 5+ years", "keywords": ["5-8 role, skill and location SEO keywords"], "hashtags": ["5-8 targeted hashtags without #"]}`;

    async function callOpenAI(apiKey, body) {
      const direct = !!apiKey;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), AI_TIMEOUT_MS);
      try {
        const res = await fetch(direct ? "https://api.openai.com/v1/chat/completions" : "/api/openai/chat/completions", {
          method: "POST",
          signal: ctrl.signal,
          headers: { "Content-Type": "application/json", ...(direct ? { Authorization: `Bearer ${apiKey}` } : {}) },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
        return { data, via: direct ? "OpenAI · your API key" : "OpenAI · server .env key" };
      } catch (err) {
        throw new Error(err.name === "AbortError" ? "OpenAI timed out" : err.message);
      } finally {
        clearTimeout(timer);
      }
    }

    async function runTalentAgent(form, apiKey) {
      const tone = TONES.find(t => t.id === form.tone);
      const brief = `Job title: ${form.title}
Department: ${form.department || "-"}
Employment type: ${form.employmentType}
Work arrangement: ${form.workplace}
Location: ${form.location || "-"}
Tone: ${tone.label} (${tone.hint})
Responsibilities & perks:
${form.details || "-"}`;
      try {
        const { data, via } = await callOpenAI(apiKey, {
          model: TEXT_MODEL,
          response_format: { type: "json_object" },
          messages: [{ role: "system", content: AGENT_PROMPT }, { role: "user", content: brief }]
        });
        const d = JSON.parse(data.choices[0].message.content);
        return {
          source: via,
          draft: {
            copy: [d.hook, d.body].filter(Boolean).join("\n\n"),
            salary: d.salary || "",
            experience: d.experience || "",
            location: form.location,
            keywords: uniq((d.keywords || []).map(k => String(k).trim())).slice(0, 8),
            hashtags: uniq((d.hashtags || []).map(stripHash)).slice(0, 8)
          }
        };
      } catch (err) {
        return { source: "Mock generator (offline)", note: err.message, draft: mockDraft(form) };
      }
    }

      { match: /barista|cafe|café|coffee|restaurant|chef|kitchen/, skills: ["Specialty Coffee", "Café Operations", "Team Leadership", "Customer Experience", "Inventory Management", "Food Safety"], salary: "RM 3,500 – 5,500 / month", experience: "Mid-level · 2+ years", tags: ["Hiring", "HospitalityJobs", "CafeLife", "BaristaLife", "FnBCareers", "MalaysiaJobs"] },

    function mockDraft(form) {
      const profile = ROLE_PROFILES.find(r => r.match.test(form.title.toLowerCase())) || DEFAULT_PROFILE;
      const tone = MOCK_TONES[form.tone] || MOCK_TONES.startup;
      const lines = form.details.split("\n").map(l => l.replace(/^[\s\-•*\d.)]+/, "").trim()).filter(Boolean);
      const isPerk = (l) => /^perks?\s*:/i.test(l);
      const duties = lines.filter(l => !isPerk(l)).slice(0, 5);
      const perks = lines.filter(isPerk).map(l => l.replace(/^perks?\s*:\s*/i, "")).join(", ").split(/,\s*/).filter(Boolean).slice(0, 4);
      const city = (form.location || "").split(",")[0].trim();

      const copy = [
        tone.hook(form.title),
        tone.intro(form),

    function Icon({ name, size = 20, className = "", strokeWidth = 2, fill = "none" }) {
      const node = window.lucide?.icons?.[name];
      const children = node ? (node[0] === "svg" ? node[2] : node) : [];
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth}
             strokeLinecap="round" strokeLinejoin="round" className={`shrink-0 ${className}`} aria-hidden="true">
          {children.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}
        </svg>
      );
    }

    // Image that never shows a broken tag
    function SafeImg({ src, alt = "", className = "", fallback = "" }) {
      const [failed, setFailed] = useState(false);
      useEffect(() => setFailed(false), [src]);
      if (!src || failed) {
        return (
          <div role="img" aria-label={alt} className={`${className} bg-gradient-to-br from-sky-100 via-indigo-100 to-violet-200 flex items-center justify-center text-slate-500 font-semibold`}>
            {fallback}
          </div>
        );
      }
      return <img src={src} alt={alt} className={className} onError={() => setFailed(true)} />;
    }

    // Size comes from className (e.g. "w-9 h-9")
    function Avatar({ src, name, className = "" }) {
      return <SafeImg src={src} alt={name} fallback={initials(name)} className={`rounded-full object-cover shrink-0 text-xs ${className}`} />;
    }

    const Card = ({ className = "", children }) => (
      <div className={`bg-white rounded-lg border border-slate-200 ${className}`}>{children}</div>

    function ChipEditor({ items, onChange, prefix = "", placeholder, chipClass, disabled }) {
      const [text, setText] = useState("");
      const add = () => {
        const v = prefix ? stripHash(text) : text.trim();
        if (v && !items.includes(v)) onChange([...items, v]);
        setText("");
      };
      return (
        <div className="flex flex-wrap gap-1.5 items-center">
          {items.map(item => (
            <span key={item} className={`inline-flex items-center gap-1 text-xs font-medium pl-2.5 pr-1.5 py-1 rounded-full ${chipClass}`}>
              {prefix}{item}
              {!disabled && (
                <button type="button" onClick={() => onChange(items.filter(i => i !== item))} className="opacity-60 hover:opacity-100" aria-label={`Remove ${item}`}>
                  <Icon name="X" size={12} />
                </button>
              )}
            </span>
          ))}
          {!disabled && (
            <input
              value={text}
              onChange={(e) => setText(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(); } }}
              onBlur={add}
              placeholder={placeholder}
              className="text-xs px-2 py-1 rounded-full border border-dashed border-slate-300 focus:outline-none focus:border-li w-28"
            />
          )}
        </div>
      );
    }

    // Highlight hashtags in post text
    function RichText({ text }) {
      return text.split(/(#[A-Za-z0-9_]+)/g).map((part, i) =>
        part.startsWith("#") ? <span key={i} className="text-li font-semibold hover:underline cursor-pointer">{part}</span> : part
      );
    }

    // =====================================================================
    // POST CARD
    // =====================================================================
    function PostCard({ post, isNew, actions }) {
      const [expanded, setExpanded] = useState(false);
      const [showComments, setShowComments] = useState(false);
      const [commentText, setCommentText] = useState("");

      const total = Object.values(post.reactions).reduce((a, b) => a + b, 0);
      const top = REACTIONS.filter(r => post.reactions[r.id] > 0).sort((a, b) => post.reactions[b.id] - post.reactions[a.id]).slice(0, 3);
      const mine = REACTIONS.find(r => r.id === post.myReaction);
      const isLong = post.body.length > 260 || post.body.split("\n").length > 4;

      const submitComment = (e) => {
        e.preventDefault();
        if (!commentText.trim()) return;
        actions.comment(post.id, commentText.trim());
        setCommentText("");
      };

      const actionBtn = "flex-1 flex items-center justify-center gap-1.5 py-3 rounded-md text-sm font-semibold text-slate-600 hover:bg-slate-100 transition";

      return (
        <article className={`bg-white rounded-lg border border-slate-200 ${isNew ? "pop-in" : ""}`}>
          {/* Header */}
          <div className="flex items-start gap-2 px-4 pt-3">

              <img src={LOGO} alt={COMPANY.name} className="w-12 h-12 rounded" />
            </button>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-1.5 flex-wrap">
                <button onClick={actions.openCompany} className="font-semibold text-sm hover:text-li hover:underline">{COMPANY.name}</button>
                {post.job && (
                  <span className="inline-flex items-center gap-1 text-[11px] font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-full px-2 py-0.5">
                    <Icon name="Briefcase" size={11} /> Hiring
                  </span>

              </div>
              <div className="text-xs text-slate-500">{fmt(COMPANY.followers)} followers</div>
              <div className="text-xs text-slate-500 flex items-center gap-1">
                {timeAgo(post.createdAt)} • <Icon name="Globe" size={12} />
                {post.byAgent && <span className="ml-1 text-violet-600 inline-flex items-center gap-0.5"><Icon name="Sparkles" size={11} /> Drafted with Agent Copilot</span>}
              </div>
            </div>
            <button className="text-slate-500 hover:bg-slate-100 rounded-full p-1.5" aria-label="More"><Icon name="Ellipsis" size={20} /></button>
          </div>

          {/* Body */}
          <div className="px-4 pt-2 pb-2 text-sm leading-relaxed text-slate-800">
            <div className={`whitespace-pre-line break-words ${isLong && !expanded ? "line-clamp-3" : ""}`}>
              <RichText text={post.body} />
            </div>
            {isLong && (
              <button onClick={() => setExpanded(!expanded)} className="text-slate-500 hover:text-li hover:underline text-sm font-medium">
                {expanded ? "show less" : "…see more"}
              </button>
            )}
          </div>

          {/* Media */}
          {post.media && (
            <SafeImg src={post.media} alt="Post media" fallback={<Icon name="Image" size={32} />} className="w-full aspect-[1.91/1] object-cover bg-slate-100" />
          )}

          {/* Job attachment */}
          {post.job && (
            <div className="mx-4 mt-3 border border-slate-200 rounded-lg p-3 flex flex-col sm:flex-row sm:items-center gap-3">
              <img src={LOGO} alt="" className="w-12 h-12 rounded hidden sm:block" />
              <div className="flex-1 min-w-0">
                <div className="font-semibold text-[15px]">{post.job.title}</div>
                <div className="text-xs text-slate-600">{COMPANY.name} · {post.job.location} ({post.job.workplace})</div>
                <div className="flex flex-wrap gap-1.5 mt-2">
                  {[post.job.salary, post.job.employmentType, post.job.experience].filter(Boolean).map(t => (
                    <span key={t} className="text-[11px] bg-slate-100 text-slate-700 rounded px-2 py-0.5">{t}</span>
                  ))}
                </div>
                {post.applicants > 0 && <div className="text-xs text-emerald-700 mt-1.5 font-medium">{fmt(post.applicants)} applicants</div>}
              </div>
              <div className="flex sm:flex-col gap-2 shrink-0">
                <button onClick={() => actions.apply(post)} className="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-li hover:bg-li-dark text-white text-sm font-semibold px-4 py-1.5 rounded-full transition">
                  <span className="bg-white text-li text-[10px] font-bold rounded-sm w-4 h-4 flex items-center justify-center">in</span> Easy Apply
                </button>
                <button onClick={() => actions.inmail(post)} className="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 border border-li text-li hover:bg-li-soft text-sm font-semibold px-4 py-1.5 rounded-full transition">
                  <Icon name="Mail" size={15} /> Send InMail
                </button>
              </div>
            </div>
          )}

          {/* Counts */}
          <div className="flex items-center justify-between px-4 pt-3 pb-2 text-xs text-slate-500">
            <div className="flex items-center gap-1">
              {top.length > 0 && (
                <span className="flex -space-x-1">

            <div className="flex gap-2">
              {post.comments.length > 0 && <button onClick={() => setShowComments(true)} className="hover:text-li hover:underline">{post.comments.length} comments</button>}

            </div>
          </div>

          {/* Action bar */}
          <div className="mx-2 border-t border-slate-200 flex">
            <div className="relative flex-1 group/like">
              <div className="absolute bottom-full left-0 pb-2 hidden group-hover/like:block z-10">
                <div className="flex gap-1 bg-white shadow-lg border border-slate-200 rounded-full px-2 py-1">

              </button>
            </div>
            <button onClick={() => setShowComments(!showComments)} className={actionBtn}>
              <Icon name="MessageSquareText" size={18} /><span className="hidden sm:inline">Comment</span>
            </button>
            <button onClick={() => actions.repost(post.id)} className={`${actionBtn} ${post.reposted ? "text-emerald-700" : ""}`}>
              <Icon name="Repeat2" size={18} /><span className="hidden sm:inline">{post.reposted ? "Reposted" : "Repost"}</span>

            <div className="px-4 pb-4 pt-1 space-y-3">

    ];

    function stepStatus(stepId, stage) {
      const order = { idle: 0, drafting: 1, review: 2, publishing: 3, published: 4 };
      const active = { agent: 1, hitl: 2, publish: 3 }[stepId];
      const s = order[stage];
      if (s === active) return "running";
      if (s > active) return "done";
      return "idle";
    }


    // =====================================================================
    // TALENT (BizFlow): suitable candidates + messaging, both sides for the demo
    // =====================================================================
    function TalentView() {
      const [data, setData] = useState({ matches: [], jobs: [], candidates_seen: 0 });
      const [sel, setSel] = useState(null);
      const [thread, setThread] = useState({ messages: [] });
      const [text, setText] = useState("");
      const endRef = useRef(null);
      useEffect(() => {
        const pull = async () => { try { setData(await fetch("/api/recruiting?business_id=" + encodeURIComponent(BIZ_ID)).then(r => r.json())); } catch {} };
        pull(); const t = setInterval(pull, 4000); return () => clearInterval(t);
      }, []);
      useEffect(() => {
        if (!sel) return;
        const pull = async () => { try { setThread(await fetch(`/api/channels/linkedin/thread?handle=${encodeURIComponent(sel.handle)}&business_id=${BIZ_ID}`).then(r => r.json())); } catch {} };
        pull(); const t = setInterval(pull, 3000); return () => clearInterval(t);
      }, [sel && sel.handle]);
      useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [thread.messages && thread.messages.length]);
      const m = sel && data.matches.find(x => x.handle === sel.handle);
      const sendAs = async (who) => {
        if (!text.trim() || !m) return;
        if (who === "candidate") await bfPost("/api/channels/linkedin/incoming", { business_id: BIZ_ID, contact: { handle: m.handle, name: m.candidate.name }, text });
        else if (thread.id) await bfPost(`/api/inbox/${thread.id}/reply`, { text });
        else await bfPost("/api/recruiting/contact", { business_id: BIZ_ID, job_id: m.job_id, handle: m.handle, text });
        setText("");
        setThread(await fetch(`/api/channels/linkedin/thread?handle=${encodeURIComponent(m.handle)}&business_id=${BIZ_ID}`).then(r => r.json()));
      };
      const job = data.jobs[0];
      return (
        <div className="grid md:grid-cols-[340px_1fr] gap-4">
          <section className="bg-white rounded-lg border border-slate-200 overflow-hidden">
            <div className="p-4 border-b border-slate-200">
              <div className="font-semibold">Suitable candidates</div>
              <div className="text-xs text-slate-500">{job ? `For ${job.title} · scored by BizFlow · ${data.candidates_seen} profiles seen` : "Create a role in BizFlow → Automations → Recruiting"}</div>
            </div>
            {data.matches.length === 0 && <div className="p-4 text-sm text-slate-500">No matches yet — BizFlow keeps looking every minute.</div>}
            {data.matches.map(x => (
              <button key={x.handle} onClick={() => setSel(x)} className={`w-full text-left px-4 py-3 border-b border-slate-100 hover:bg-slate-50 flex gap-3 items-center ${sel && sel.handle === x.handle ? "bg-li-soft" : ""}`}>
                <div className="w-11 h-11 rounded-full bg-gradient-to-br from-li to-violet-600 text-white flex items-center justify-center font-semibold shrink-0">{(x.candidate.name || "?").slice(0, 1)}</div>
                <div className="min-w-0 flex-1">
                  <div className="font-semibold text-sm truncate">{x.candidate.name}</div>
                  <div className="text-xs text-slate-500 truncate">{x.candidate.headline}</div>
                  <div className="text-xs text-slate-500">{(x.candidate.availability || []).join(", ")} · {x.status === "contacted" ? "messaged" : "new"}</div>
                </div>
                <div className={`text-sm font-bold rounded px-2 py-1 ${x.score >= 80 ? "bg-emerald-100 text-emerald-800" : "bg-slate-100 text-slate-700"}`}>{x.score}</div>
              </button>
            ))}
          </section>
          <section className="bg-white rounded-lg border border-slate-200 flex flex-col min-h-[520px]">
            {!m ? <div className="p-6 text-sm text-slate-500">Pick a candidate to see why they fit and to message them.</div> : (<>
              <div className="p-4 border-b border-slate-200">
                <div className="font-semibold">{m.candidate.name} <span className="text-xs font-normal text-slate-500">· {m.candidate.location} · expects MYR {m.candidate.expected_pay}/h</span></div>
                <ul className="text-xs text-slate-600 mt-1 list-disc pl-5">{(m.why || []).map((w, i) => <li key={i}>{w}</li>)}</ul>
              </div>
              <div className="flex-1 overflow-y-auto p-4 space-y-2 bg-slate-50">
                {(thread.messages || []).length === 0 && <div className="text-sm text-slate-500">No messages yet. Send one as {COMPANY.name}, or from BizFlow → ✉ Message on LinkedIn.</div>}
                {(thread.messages || []).map(msg => (
                  <div key={msg.id} className={`max-w-[75%] rounded-2xl px-3 py-2 text-sm whitespace-pre-wrap ${msg.from === "me" ? "ml-auto bg-li text-white" : "bg-white border border-slate-200"}`}>
                    <div className="text-[11px] opacity-70 mb-0.5">{msg.from === "me" ? COMPANY.name + (msg.by === "auto" ? " (auto)" : "") : m.candidate.name}</div>{msg.text}
                  </div>))}
                <div ref={endRef} />
              </div>
              <div className="p-3 border-t border-slate-200 space-y-2">
                <textarea value={text} onChange={e => setText(e.target.value)} rows={3} placeholder="Write a message…" className="w-full border border-slate-300 rounded px-3 py-2 text-sm" />
                <div className="flex flex-wrap gap-2 justify-end">
                  <button onClick={() => sendAs("candidate")} className="border border-slate-400 text-slate-700 font-semibold text-sm px-4 py-1.5 rounded-full hover:bg-slate-50">Reply as {(m.candidate.name || "candidate").split(" (")[0]} (demo)</button>
                  <button onClick={() => sendAs("company")} className="bg-li text-white font-semibold text-sm px-4 py-1.5 rounded-full">Send as {COMPANY.name}</button>
                </div>
              </div>
            </>)}
          </section>
        </div>
      );
    }

    function StudioView({ apiKey, onPublish, onOpenKey, onReset }) {
      const [form, setForm] = useState(EMPTY_FORM);
      const [stage, setStage] = useState("idle"); // idle | drafting | review | publishing | published
      const [draft, setDraft] = useState(null);
      const [source, setSource] = useState(null);
      const [logs, setLogs] = useState([{ t: Date.now(), agent: "System", msg: "Agents online. Waiting for a job brief." }]);
      const [mediaError, setMediaError] = useState("");
      const [dragging, setDragging] = useState(false);
      const logRef = useRef(null);

      const locked = stage === "drafting" || stage === "publishing";
      const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));
      const log = (agent, msg) => setLogs(l => [...l, { t: Date.now(), agent, msg }]);
      const setD = (k, v) => setDraft(d => ({ ...d, [k]: v }));

      useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [logs]);

      const handleFile = async (file) => {
        setMediaError("");
        try { setForm(f => ({ ...f, media: "" })); const url = await readImageFile(file); setForm(f => ({ ...f, media: url })); }
        catch (err) { setMediaError(err.message); }
      };

      const generate = async () => {
        if (!form.title.trim() || locked) return;
        setStage("drafting");
        setDraft(null);
        const tone = TONES.find(t => t.id === form.tone).label;
        log("Talent & Content Agent", `Received brief: "${form.title}" · ${form.workplace} · ${form.location || "no location"}`);
        log("Talent & Content Agent", `Applying tone profile "${tone}" and LinkedIn reach heuristics…`);

        const [result] = await Promise.all([runTalentAgent({ ...form, title: form.title.trim() }, apiKey.trim()), wait(1400)]);
        if (result.note) log("System", `OpenAI unavailable (${result.note}). Switched to mock fallback generator.`);
        log("Talent & Content Agent", `Draft ready via ${result.source}: ${result.draft.keywords.length} SEO keywords, ${result.draft.hashtags.length} hashtags.`);
        log("HITL Gatekeeper", "Awaiting owner review and authorization.");
        setSource(result.source);
        setDraft(result.draft);
        setStage("review");
      };

      const approve = async () => {
        if (stage !== "review" || !draft.copy.trim()) return;
        log("HITL Gatekeeper", `Approved by ${VIEWER.name}.`);
        setStage("publishing");
        log("LinkedIn Publishing Engine", `Publishing to ${COMPANY.name} feed and company page…`);
        await wait(1300);

        const tags = draft.hashtags.map(h => `#${h}`).join(" ");
        onPublish({
          id: `agent_${Date.now()}`,
          createdAt: Date.now(),
          body: tags ? `${draft.copy.trim()}\n\n${tags}` : draft.copy.trim(),
          media: form.media,
          job: {
            title: form.title.trim(), department: form.department, location: draft.location || form.location,
            workplace: form.workplace, employmentType: form.employmentType, salary: draft.salary, experience: draft.experience
          },
          keywords: draft.keywords,
          reactions: { like: 0, celebrate: 0, love: 0, insightful: 0 },
          myReaction: null, comments: [], reposts: 0, reposted: false, applicants: 0, byAgent: true
        });
        log("LinkedIn Publishing Engine", "Post is live. ✅");
        setStage("published");
      };

      const discard = () => {
        setDraft(null);
        setStage("idle");
        log("HITL Gatekeeper", "Draft rejected by owner.");
      };

      const startOver = () => {
        setForm(EMPTY_FORM);
        setDraft(null);
        setStage("idle");
        log("System", "Ready for a new job brief.");
      };

      const hook = draft?.copy.split("\n")[0] || "";
      const input = "w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-li focus:ring-1 focus:ring-li disabled:bg-slate-50";
      const label = "block text-xs font-semibold text-slate-600 mb-1";

      return (

                <p className="text-xs text-slate-500">Multi-agent autonomous hiring & content workflow · posting as {COMPANY.name}</p>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={onOpenKey} className={`inline-flex items-center gap-1.5 text-xs font-semibold rounded-full px-3 py-1.5 border ${apiKey ? "border-emerald-300 bg-emerald-50 text-emerald-800" : "border-slate-300 text-slate-600 hover:bg-slate-50"}`}>
                  <Icon name="KeyRound" size={14} /> {apiKey ? "OpenAI key set" : "AI: auto (server → mock)"}
                </button>
                <button onClick={onReset} className="inline-flex items-center gap-1 text-xs text-slate-500 hover:text-slate-800 px-2 py-1.5">
                  <Icon name="RotateCcw" size={13} /> Reset demo

            </div>

                    s === "running" ? "border-li bg-li-soft" : s === "done" ? "border-emerald-200 bg-emerald-50" : "border-slate-200"

                    <div className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 ${
                      s === "running" ? "bg-li text-white" : s === "done" ? "bg-emerald-600 text-white" : "bg-slate-100 text-slate-500"

                      {s === "done" ? <Icon name="Check" size={18} /> : s === "running" && step.id !== "hitl" ? <Icon name="LoaderCircle" size={18} className="animate-spin" /> : <Icon name={step.icon} size={18} />}
                    </div>

                      <div className="text-sm font-semibold truncate">{i + 1}. {step.name}</div>
                      <div className="text-xs text-slate-500">
                        {s === "running" ? (step.id === "hitl" ? "Waiting for your approval" : "Working…") : s === "done" ? "Completed" : step.desc}
                      </div>
                    </div>
                  </li>
                );
              })}
            </ol>

            <div ref={logRef} className="mt-3 bg-slate-900 text-slate-200 rounded-md px-3 py-2 font-mono text-[11px] leading-5 h-24 overflow-y-auto">
              {logs.map((l, i) => (
                <div key={i}>
                  <span className="text-slate-500">{new Date(l.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })}</span>{" "}
                  <span className={l.agent === "System" ? "text-amber-300" : l.agent.startsWith("HITL") ? "text-emerald-300" : l.agent.startsWith("LinkedIn") ? "text-violet-300" : "text-sky-300"}>[{l.agent}]</span>{" "}
                  {l.msg}
                </div>
              ))}
            </div>
          </Card>

          <div className="grid lg:grid-cols-2 gap-4 items-start">
            {/* INPUT PANEL */}
            <Card className="p-4 space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-2">

              </div>

              <fieldset disabled={locked} className="space-y-3">
                <div>
                  <label className={label}>Job title *</label>
                  <input value={form.title} onChange={set("title")} placeholder="e.g. Senior Full-Stack Engineer" className={input} />
                </div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <div>
                    <label className={label}>Department</label>
                    <input value={form.department} onChange={set("department")} placeholder="e.g. Engineering" className={input} />
                  </div>
                  <div>
                    <label className={label}>Location</label>
                    <input value={form.location} onChange={set("location")} placeholder="e.g. Subang Jaya, Selangor" className={input} />
                  </div>
                  <div>
                    <label className={label}>Employment type</label>
                    <select value={form.employmentType} onChange={set("employmentType")} className={input}>

                  <div>
                    <label className={label}>Workplace</label>
                    <div className="grid grid-cols-3 gap-1">
                      {WORKPLACES.map(w => (
                        <button key={w} type="button" onClick={() => setForm(f => ({ ...f, workplace: w }))}
                                className={`text-xs font-medium py-2 rounded-md border transition ${form.workplace === w ? "border-li bg-li-soft text-li" : "border-slate-300 hover:bg-slate-50"}`}>
                          {w}

                      ))}
                    </div>
                  </div>
                </div>
                <div>
                  <label className={label}>Key responsibilities & perks</label>
                  <textarea value={form.details} onChange={set("details")} rows={5} placeholder={"- What the person will do\n- …\nPerks: flexible hours, learning budget"} className={`${input} resize-y`} />
                </div>

                {/* Media */}
                <div>
                  <label className={label}>Media attachment</label>
                  <div className="grid grid-cols-4 gap-2">
                    {MEDIA_PRESETS.map(m => (
                      <button key={m.label} type="button" onClick={() => setForm(f => ({ ...f, media: m.url }))}
                              className={`relative rounded-md overflow-hidden border-2 transition ${form.media === m.url ? "border-li" : "border-transparent hover:border-slate-300"}`}>

                {stage === "drafting"

                {source && draft && (
                  <span className={`text-[11px] font-semibold rounded-full px-2 py-0.5 ${source.startsWith("OpenAI") ? "bg-emerald-50 text-emerald-700" : "bg-amber-50 text-amber-700"}`}>{source}</span>

                    <h3 className="text-xs font-semibold text-slate-600 mb-2 uppercase tracking-wide">Job specs</h3>
                    <div className="grid sm:grid-cols-3 gap-2">
                      {[["salary", "Salary estimate", "Banknote", "text-emerald-700 bg-emerald-50"], ["location", "Location", "MapPin", "text-li bg-li-soft"], ["experience", "Experience level", "GraduationCap", "text-violet-700 bg-violet-50"]].map(([k, l, icon, tint]) => (
                        <div key={k} className="border border-slate-200 rounded-md p-2.5">
                          <div className="flex items-center gap-1.5 text-[11px] text-slate-500 font-semibold">
                            <span className={`w-5 h-5 rounded flex items-center justify-center ${tint}`}><Icon name={icon} size={12} /></span>{l}
                          </div>
                          <input value={draft[k]} onChange={(e) => setD(k, e.target.value)} disabled={stage !== "review"}
                                 className="w-full text-sm font-semibold mt-1 bg-transparent focus:outline-none focus:bg-slate-50 rounded px-0.5" />
                        </div>
                      ))}
                    </div>
                    <div className="text-[11px] text-slate-500 mt-1.5">{form.employmentType} · {form.workplace}{form.department && ` · ${form.department}`}</div>
                  </div>

                  {/* SEO */}
                  <div className="space-y-2.5">
                    <h3 className="text-xs font-semibold text-slate-600 uppercase tracking-wide flex items-center gap-1.5"><Icon name="TrendingUp" size={14} /> SEO & discoverability</h3>
                    <div>
                      <div className="text-[11px] text-slate-500 mb-1">Role keywords</div>
                      <ChipEditor items={draft.keywords} onChange={(v) => setD("keywords", v)} placeholder="+ keyword" chipClass="bg-slate-100 text-slate-700" disabled={stage !== "review"} />
                    </div>
                    <div>
                      <div className="text-[11px] text-slate-500 mb-1">Hashtags ({draft.hashtags.length}, aim for 5–8)</div>
                      <ChipEditor items={draft.hashtags} onChange={(v) => setD("hashtags", v)} prefix="#" placeholder="+ hashtag" chipClass="bg-li-soft text-li" disabled={stage !== "review"} />
                    </div>
                  </div>

                  {/* Approval CTA */}
                  <div className="flex flex-col sm:flex-row gap-2 pt-1">
                    <button onClick={approve} disabled={stage !== "review" || !draft.copy.trim()}
                            className="flex-1 inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 text-white font-semibold py-2.5 rounded-full transition">
                      {stage === "publishing"
                        ? <><Icon name="LoaderCircle" size={18} className="animate-spin" /> Publishing to LinkedIn…</>
                        : <><Icon name="ShieldCheck" size={18} /> Approve & Publish to LinkedIn</>}
                    </button>
                    <button onClick={discard} disabled={stage !== "review"} className="border border-slate-400 text-slate-600 hover:bg-slate-50 disabled:opacity-40 font-semibold text-sm px-4 py-2.5 rounded-full">
                      Reject
                    </button>
                  </div>
                </div>
              )}
            </Card>
          </div>
        </div>
      );
    }

    // =====================================================================
    // MODALS (Easy Apply, InMail, API key)
    // =====================================================================
    function Modal({ modal, onClose, onApplied, onInMailSent, apiKey, onSaveKey }) {
      const [values, setValues] = useState({});
      const [keyDraft, setKeyDraft] = useState(apiKey);
      useEffect(() => {
        setKeyDraft(apiKey);
        setValues(modal?.type === "inmail" ? { message: `Hi ${COMPANY.name} team,\n\nI came across your ${modal.post.job.title} role and would love to learn more about it.\n\nBest regards` } : {});
      }, [modal]);
      if (!modal) return null;
      const set = (k) => (e) => setValues(v => ({ ...v, [k]: e.target.value }));
      const input = "w-full border border-slate-400 rounded px-3 py-2 text-sm focus:outline-none focus:border-li focus:ring-1 focus:ring-li";
      const job = modal.post?.job;

      return (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={onClose}>
          <div className="bg-white rounded-lg w-full max-w-lg shadow-xl max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between px-5 py-3 border-b border-slate-200">
              <h2 className="font-semibold">
                {modal.type === "apply" && `Apply to ${COMPANY.name}`}
                {modal.type === "inmail" && "New InMail"}
                {modal.type === "apikey" && "OpenAI connection"}
              </h2>
              <button onClick={onClose} className="p-1.5 rounded-full hover:bg-slate-100" aria-label="Close"><Icon name="X" size={20} /></button>
            </div>

            {modal.type === "apply" && (
              <form className="p-5 space-y-3" onSubmit={(e) => { e.preventDefault(); onApplied(modal.post, values); }}>
                <div className="flex items-center gap-3 bg-slate-50 rounded-md p-3">
                  <img src={LOGO} alt="" className="w-10 h-10 rounded" />
                  <div><div className="font-semibold text-sm">{job.title}</div><div className="text-xs text-slate-500">{job.location} ({job.workplace})</div></div>
                </div>
                <div><label className="text-xs font-semibold text-slate-600">Full name *</label><input required value={values.name || ""} onChange={set("name")} className={input} /></div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <div><label className="text-xs font-semibold text-slate-600">Email *</label><input required type="email" value={values.email || ""} onChange={set("email")} className={input} /></div>
                  <div><label className="text-xs font-semibold text-slate-600">Phone</label><input value={values.phone || ""} onChange={set("phone")} className={input} /></div>
                </div>
                <div><label className="text-xs font-semibold text-slate-600">Skills (comma separated)</label><input value={values.skills || ""} onChange={set("skills")} placeholder="customer service, food handling, cashier" className={input} /></div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <div><label className="text-xs font-semibold text-slate-600">Expected pay (MYR / hour)</label><input type="number" value={values.expected_pay || ""} onChange={set("expected_pay")} className={input} /></div>
                  <div><label className="text-xs font-semibold text-slate-600">Where you live / study</label><input value={values.location || ""} onChange={set("location")} placeholder="Universiti Malaya, Kuala Lumpur" className={input} /></div>
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Days you can work</label>
                  <div className="flex flex-wrap gap-2 mt-1">{["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => (
                    <label key={d} className={`text-xs border rounded-full px-2.5 py-1 cursor-pointer ${(values.availability || []).includes(d) ? "bg-li text-white border-li" : "border-slate-400"}`}>
                      <input type="checkbox" className="hidden" checked={(values.availability || []).includes(d)} onChange={() => setValues(v => ({ ...v, availability: (v.availability || []).includes(d) ? v.availability.filter(x => x !== d) : [...(v.availability || []), d] }))} />{d}
                    </label>))}</div>
                </div>
                <div className="flex gap-4 text-xs">{["food handler","typhoid"].map(c => (
                  <label key={c} className="flex items-center gap-1.5"><input type="checkbox" checked={(values.certs || []).includes(c)} onChange={() => setValues(v => ({ ...v, certs: (v.certs || []).includes(c) ? v.certs.filter(x => x !== c) : [...(v.certs || []), c] }))} />{c === "typhoid" ? "Typhoid jab done" : "Food handler certificate"}</label>))}</div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Resume</label>
                  <label className="flex items-center gap-2 border border-dashed border-slate-400 rounded px-3 py-2.5 text-sm text-slate-600 cursor-pointer hover:bg-slate-50">
                    <Icon name="Upload" size={16} /> {values.resume || "Upload resume (PDF, DOCX)"}
                    <input type="file" accept=".pdf,.doc,.docx" className="hidden" onChange={(e) => setValues(v => ({ ...v, resume: e.target.files[0]?.name }))} />
                  </label>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={onClose} className="border border-slate-400 text-slate-600 font-semibold text-sm px-4 py-1.5 rounded-full hover:bg-slate-50">Cancel</button>
                  <button className="bg-li hover:bg-li-dark text-white font-semibold text-sm px-4 py-1.5 rounded-full">Submit application</button>
                </div>
              </form>
            )}

            {modal.type === "inmail" && (
              <form className="p-5 space-y-3" onSubmit={(e) => { e.preventDefault(); onInMailSent(values); }}>
                <div className="text-sm"><span className="text-slate-500">To:</span> <strong>{COMPANY.name} · Talent team</strong></div>
                <div className="grid sm:grid-cols-2 gap-3">
                  <div><label className="text-xs font-semibold text-slate-600">Your name *</label><input required value={values.name || ""} onChange={set("name")} className={input} /></div>
                  <div><label className="text-xs font-semibold text-slate-600">Email</label><input type="email" value={values.email || ""} onChange={set("email")} className={input} /></div>
                </div>
                <div><label className="text-xs font-semibold text-slate-600">Subject</label><input defaultValue={`Interested in ${job.title}`} className={input} /></div>
                <textarea value={values.message || ""} onChange={set("message")} rows={6} className={`${input} resize-y`} />
                <div className="flex justify-end gap-2">
                  <button type="button" onClick={onClose} className="border border-slate-400 text-slate-600 font-semibold text-sm px-4 py-1.5 rounded-full hover:bg-slate-50">Cancel</button>
                  <button className="bg-li hover:bg-li-dark text-white font-semibold text-sm px-4 py-1.5 rounded-full inline-flex items-center gap-1.5"><Icon name="Send" size={14} /> Send</button>
                </div>
              </form>
            )}

            {modal.type === "apikey" && (
              <div className="p-5 space-y-3">
                <p className="text-sm text-slate-600">The Talent & Content Agent tries these in order, so the demo never breaks:</p>
                <ol className="text-sm text-slate-700 space-y-1 list-decimal pl-5">
                  <li>An OpenAI API key entered here (stored only in this browser)</li>
                  <li>The key in <code className="bg-slate-100 px-1 rounded">.env</code> when served by <code className="bg-slate-100 px-1 rounded">node server.js</code></li>
                  <li>The built-in mock generator (offline)</li>
                </ol>
                <input type="password" value={keyDraft} onChange={(e) => setKeyDraft(e.target.value)} placeholder="sk-… (optional)" className={input} />
                <div className="flex justify-between gap-2 pt-1">
                  <button onClick={() => onSaveKey("")} className="text-sm text-slate-500 hover:text-red-600">Clear key</button>
                  <button onClick={() => onSaveKey(keyDraft.trim())} className="bg-li hover:bg-li-dark text-white font-semibold text-sm px-4 py-1.5 rounded-full">Save</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =====================================================================
    // APP SHELL
    // =====================================================================
    function App() {
      const [view, setView] = useState("feed"); // feed | jobs | company | studio | notifications
      const [posts, setPosts] = useState(() => load(LS.posts, null) || makeSeedPosts());
      const [notifs, setNotifs] = useState(() => load(LS.notifs, null) || makeSeedNotifs());
      const [newPostId, setNewPostId] = useState(null);
      const [toast, setToast] = useState(null);
      const [modal, setModal] = useState(null);
      const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem(LS.key) || ""; } catch { return ""; } });
      const [query, setQuery] = useState("");
      const [, setTick] = useState(0);

      useEffect(() => { savePosts(posts); }, [posts]);
      useEffect(() => {
        const pull = async () => {
          try {
            const r = await fetch("/api/linkedin/posts?business_id=" + encodeURIComponent(BIZ_ID)).then(x => x.json());
            setPosts(prev => {
              const keep = prev.filter(p => !p.fromBizFlow);
              const bf = r.posts.map(p => { const old = prev.find(x => x.id === p.id); return old ? { ...p, reactions: old.reactions, myReaction: old.myReaction, comments: old.comments } : p; });
              const next = [...bf, ...keep].sort((a, b) => b.createdAt - a.createdAt);
              return JSON.stringify(next.map(p => [p.id, p.applicants])) === JSON.stringify(prev.map(p => [p.id, p.applicants])) ? prev : next;
            });
          } catch { /* BizFlow not reachable */ }
        };
        pull(); const t = setInterval(pull, 4000); return () => clearInterval(t);
      }, []);
      useEffect(() => { save(LS.notifs, notifs); }, [notifs]);
      useEffect(() => { window.scrollTo(0, 0); }, [view]);
      useEffect(() => { if (view === "notifications") setNotifs(ns => ns.some(n => !n.read) ? ns.map(n => ({ ...n, read: true })) : ns); }, [view, notifs]);
      // Refresh relative timestamps ("Just now" → "1m")
      useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 30000); return () => clearInterval(t); }, []);
      // Keep multiple open tabs in sync
      useEffect(() => {
        const onStorage = (e) => {
          if (e.key === LS.posts) setPosts(load(LS.posts, null) || makeSeedPosts());
          if (e.key === LS.notifs) setNotifs(load(LS.notifs, null) || makeSeedNotifs());
        };
        window.addEventListener("storage", onStorage);
        return () => window.removeEventListener("storage", onStorage);
      }, []);

      const showToast = (msg, icon = "CircleCheck") => {
        const id = Date.now();
        setToast({ id, msg, icon });
        setTimeout(() => setToast(t => (t?.id === id ? null : t)), 3500);
      };
      const updatePost = (id, fn) => setPosts(ps => ps.map(p => (p.id === id ? fn(p) : p)));

      const actions = {
        react: (id, type) => updatePost(id, p => {
          const reactions = { ...p.reactions };
          if (p.myReaction) reactions[p.myReaction] -= 1;
          const next = p.myReaction === type ? null : type;
          if (next) reactions[next] = (reactions[next] || 0) + 1;
          return { ...p, reactions, myReaction: next };
        }),
        comment: (id, text) => updatePost(id, p => ({
          ...p, comments: [{ id: `c_${Date.now()}`, author: VIEWER.name, headline: VIEWER.headline, avatar: VIEWER.avatar, text, createdAt: Date.now() }, ...p.comments]
        })),
        repost: (id) => {
          const p = posts.find(x => x.id === id);
          updatePost(id, x => ({ ...x, reposted: !x.reposted, reposts: x.reposts + (x.reposted ? -1 : 1) }));
          showToast(p?.reposted ? "Repost removed" : "Reposted to your feed", "Repeat2");
        },
        send: () => {
          try { navigator.clipboard?.writeText(window.location.href); } catch {}
          showToast("Link copied. Share it in a message.", "Send");
        },
        apply: (post) => setModal({ type: "apply", post }),
        inmail: (post) => setModal({ type: "inmail", post }),
        openCompany: () => setView("company")
      };

      const publish = (post) => {
        setPosts(ps => [post, ...ps]);
        setNotifs(ns => [{ id: `n_${Date.now()}`, icon: "Rocket", postId: post.id, createdAt: Date.now(), read: false,
          text: `Your post “${post.job.title}” is live. The Publishing Engine shared it with ${fmt(COMPANY.followers)} followers.` }, ...ns]);
        setNewPostId(post.id);
        setQuery("");
        setTimeout(() => {
          setView("feed");
          showToast("Your post is now live on LinkedIn", "Rocket");
        }, 500);
        setTimeout(() => setNewPostId(id => (id === post.id ? null : id)), 6000);
      };

      const resetDemo = () => {
        setPosts(makeSeedPosts());
        setNotifs(makeSeedNotifs());
        showToast("Demo data reset", "RotateCcw");
      };

      const saveKey = (key) => {
        setApiKey(key);
        try { key ? localStorage.setItem(LS.key, key) : localStorage.removeItem(LS.key); } catch {}
        setModal(null);
        showToast(key ? "OpenAI key saved in this browser" : "OpenAI key cleared", "KeyRound");
      };

      const unread = notifs.filter(n => !n.read).length;
      const NAV = [
        { id: "feed", label: "Home", icon: "House" },
        { id: "jobs", label: "Jobs", icon: "Briefcase" },
        { id: "company", label: "Company", icon: "Building2" },
        { id: "talent", label: "Talent", icon: "Users" },
        { id: "studio", label: "Copilot Studio", icon: "Sparkles", accent: true },
        { id: "notifications", label: "Notifications", icon: "Bell", badge: unread }
      ];

      return (
        <div className="min-h-screen">
          {/* TOP NAV */}
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200">
            <div className="max-w-[1128px] mx-auto px-3 sm:px-4 h-[52px] flex items-center gap-2">
              <button onClick={() => setView("feed")} className="w-[34px] h-[34px] rounded bg-li text-white font-bold text-xl leading-none flex items-center justify-center shrink-0" aria-label="Home">in</button>
              <div className="hidden sm:flex items-center gap-2 bg-li-soft rounded px-3 h-[34px] w-44 lg:w-72">
                <Icon name="Search" size={16} className="text-slate-600" />
                <input value={query} onChange={(e) => { setQuery(e.target.value); if (view !== "feed") setView("feed"); }} placeholder="Search"
                       className="bg-transparent text-sm outline-none w-full placeholder-slate-600" />
              </div>
              <nav className="ml-auto flex items-stretch h-full">
                {NAV.map(item => {
                  const active = view === item.id;
                  return (
                    <button key={item.id} onClick={() => setView(item.id)}
                            className={`relative flex flex-col items-center justify-center min-w-[44px] sm:min-w-[64px] lg:min-w-[80px] px-1 border-b-2 transition ${
                              active ? "border-slate-900 text-slate-900" : "border-transparent text-slate-500 hover:text-slate-900"
                            }`}>
                      <span className="relative">
                        <Icon name={item.icon} size={22} className={item.accent && !active ? "text-violet-600" : ""} fill={active && item.icon !== "Sparkles" ? "currentColor" : "none"} strokeWidth={active ? 1.5 : 2} />
                        {item.badge > 0 && <span className="absolute -top-1 -right-2 bg-red-600 text-white text-[10px] font-bold rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center">{item.badge}</span>}
                      </span>
                      <span className="hidden md:block text-[12px] mt-0.5 whitespace-nowrap">{item.label}</span>
                    </button>
                  );
                })}
                <button onClick={() => setModal({ type: "apikey" })} className="flex flex-col items-center justify-center min-w-[44px] sm:min-w-[64px] px-1 text-slate-500 hover:text-slate-900 border-l border-slate-200 ml-1" title="AI settings">
                  <Avatar src={VIEWER.avatar} name={VIEWER.name} className="w-6 h-6" />
                  <span className="hidden md:flex items-center text-[12px] mt-0.5">Me <Icon name="ChevronDown" size={14} /></span>
                </button>
              </nav>
            </div>
          </header>

          <main className="max-w-[1128px] mx-auto px-3 sm:px-4 py-6">
            {view === "talent" && <TalentView />}
            {view === "feed" && <FeedView posts={posts} query={query} newPostId={newPostId} actions={actions} go={setView} />}
            {view === "jobs" && <div className="max-w-3xl mx-auto"><JobsList posts={posts} actions={actions} title={`Jobs at ${COMPANY.name}`} /></div>}
            {view === "company" && <CompanyView posts={posts} newPostId={newPostId} actions={actions} />}
            {view === "notifications" && <NotificationsView notifs={notifs} go={setView} />}
            {/* Studio stays mounted so drafts and agent logs survive navigation */}
            <div className={view === "studio" ? "" : "hidden"}>
              <StudioView apiKey={apiKey} onPublish={publish} onOpenKey={() => setModal({ type: "apikey" })} onReset={resetDemo} />
            </div>
          </main>

          {/* TOAST */}
          {toast && (
            <div key={toast.id} className="toast-in fixed bottom-5 left-4 sm:left-6 z-50 flex items-center gap-2.5 bg-slate-900 text-white text-sm font-medium pl-3 pr-4 py-3 rounded-lg shadow-2xl max-w-[calc(100vw-2rem)]">
              <Icon name={toast.icon} size={18} className="text-emerald-400" /> {toast.msg}
            </div>
          )}

          <Modal
            modal={modal}
            onClose={() => setModal(null)}
            apiKey={apiKey}
            onSaveKey={saveKey}
            onApplied={(post, v) => {
              updatePost(post.id, p => ({ ...p, applicants: p.applicants + 1 }));
              setModal(null);
              bfPost("/api/linkedin/apply", { business_id: BIZ_ID, job_id: post.job?.bizflow_job_id, ...v })
                .then(r => showToast(`Application sent to ${COMPANY.name} — BizFlow is scoring it`)).catch(() => showToast(`Application sent to ${COMPANY.name}`));
            }}
            onInMailSent={(v) => {
              setModal(null);
              bfPost("/api/channels/linkedin/incoming", { business_id: BIZ_ID, contact: { handle: slug(v.email || v.name), name: v.name || "LinkedIn member" }, text: v.message || "" })
                .then(() => showToast("InMail delivered to the owner's BizFlow inbox", "Mail")).catch(() => showToast("InMail sent", "Mail"));
            }}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
