<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Online — BizFlow Shop (demo)</title>
<style>
:root{--ink:#1d2b24;--muted:#5f6f66;--line:#e2e8e4;--bg:#f7f5ef;--card:#fff;--brand:#1f4d3a;--accent:#e8a33d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
.demo{background:#fff3cd;color:#6b5200;text-align:center;font-size:13px;padding:6px 12px}
header{background:var(--brand);color:#fff;padding:18px 16px}
header .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .em{font-size:44px}
header h1{margin:0;font-size:26px}
header .sub{opacity:.85;font-size:14px}
header select{margin-left:auto;font-size:14px;padding:6px 8px;border-radius:8px;border:0}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.item .pic{height:90px;border-radius:10px;background:linear-gradient(135deg,#fdf0d5,#f6d6a8);display:flex;align-items:center;justify-content:center;font-size:40px}
.item b{font-size:17px}
.item .price{font-weight:800;color:var(--brand)}
.item .note{font-size:12px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px;margin-top:auto}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.qty span{min-width:20px;text-align:center;font-weight:800}
.add{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:8px;font-weight:700;cursor:pointer;margin-top:auto}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;align-self:start;position:sticky;top:12px}
aside h2{margin:0 0 8px;font-size:19px}
.line{display:flex;justify-content:space-between;font-size:15px;padding:4px 0;border-bottom:1px dashed var(--line)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:10px 0}
label{display:block;font-size:13px;font-weight:700;margin-top:8px}
input,textarea,select.f{width:100%;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px;font-family:inherit}
.seg{display:flex;gap:6px;margin-top:4px}
.seg button{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.go{width:100%;margin-top:12px;background:var(--accent);color:#1d1300;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:800;cursor:pointer}
.go:disabled{opacity:.5;cursor:not-allowed}
.small{font-size:12px;color:var(--muted)}
.err{color:#b3261e;font-weight:700;margin-top:8px}
.done{background:#eaf6ee;border:1px solid #2e8b57;border-radius:12px;padding:14px}
.closed{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:20px}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="demo">DEMO SHOP · synthetic business · no real payment — orders go to the owner's BizFlow app</div>
<header><div class="in"><span class="em" id="em">🛍️</span><div><h1 id="nm">Loading…</h1><div class="sub" id="sub"></div></div>
  <select id="pick" aria-label="Switch shop (demo)"></select></div></header>
<main id="main">
  <section><div class="grid" id="grid"></div></section>
  <aside id="cart">
    <h2>🧺 Your order</h2>
    <div id="lines"><div class="empty">Add something tasty 👈</div></div>
    <div class="total"><span>Total</span><span id="tot">MYR 0.00</span></div>
    <div id="form">
      <label>Your name<input id="name" autocomplete="name" placeholder="e.g. Aina"></label>
      <label>Phone (optional, for pickup updates)<input id="phone" inputmode="tel" placeholder="01x-xxx xxxx"></label>
      <label>Pickup or delivery</label>
      <div class="seg"><button id="fp" class="on" type="button">🏃 Pickup</button><button id="fd" type="button">🛵 Delivery</button></div>
      <label id="addrl" hidden>Deliver to<input id="addr" placeholder="e.g. KK8, Universiti Malaya"></label>
      <label>When?<input id="when" placeholder="e.g. today 3pm"></label>
      <label>Note (optional)<textarea id="note" rows="2" placeholder="Less sugar, no nuts…"></textarea></label>
      <div class="small" style="margin-top:8px">💵 Pay on pickup / delivery (cash or DuitNow QR). Demo: no payment is taken.</div>
      <button class="go" id="go" disabled>Place order</button>
      <div class="err" id="err"></div>
    </div>
    <div class="done" id="ok" hidden></div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
let BID = qs.get("business_id") || "campus-crumb", MENU = [], CART = {}, FUL = "pickup";
const ICON = n => /cookie/i.test(n) ? "🍪" : /tea|teh|drink|kopi|coffee|juice|latte|milo|sirap/i.test(n) ? "🧋" : /muffin|cake|kuih/i.test(n) ? "🧁" : /bun|bread|pau/i.test(n) ? "🥯" : /bar|granola/i.test(n) ? "🥣" : /rice|nasi|mee|noodle/i.test(n) ? "🍛" : "🍽️";
const money = v => "MYR " + Number(v).toFixed(2);
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

async function load() {
  const r = await fetch("/api/shop/info?business_id=" + encodeURIComponent(BID)); const d = await r.json();
  if (!r.ok) { $("#nm").textContent = "Shop not found"; return; }
  document.title = d.business.name + " — Order online (demo)";
  $("#em").textContent = d.business.emoji || "🛍️"; $("#nm").textContent = d.business.name; $("#sub").textContent = (d.business.type || "") + " · 📍 " + (d.business.area || "");
  $("#pick").replaceChildren(...d.shops.map(s => { const o = h("option", null, s.emoji + " " + s.name); o.value = s.id; o.selected = s.id === BID; return o; }));
  MENU = d.menu; CART = {};
  const g = $("#grid"); g.replaceChildren();
  $("#cart").hidden = !d.open || !MENU.length;
  if (!d.open) { g.append(Object.assign(h("div", "closed"), { innerHTML: "<h2>😴 Closed for online orders</h2><p>This shop is not taking online orders right now. Please message the seller directly.</p>" })); return; }
  if (!MENU.length) { g.append(Object.assign(h("div", "closed"), { innerHTML: "<h2>🧾 Menu coming soon</h2><p>The owner hasn't added items yet (BizFlow → ⚙️ Settings → Online shop menu).</p>" })); return; }
  MENU.forEach(m => {
    const c = h("div", "item"); c.append(h("div", "pic", ICON(m.item)), h("b", null, m.item), h("div", "price", money(m.price)));
    if (m.note) c.append(h("div", "note", m.note));
    const q = h("div", "qty"), minus = h("button", null, "−"), n = h("span", null, "0"), plus = h("button", null, "+");
    const set = v => { CART[m.item] = Math.max(0, Math.min(99, v)); n.textContent = CART[m.item]; draw(); };
    minus.onclick = () => set((CART[m.item] || 0) - 1); plus.onclick = () => set((CART[m.item] || 0) + 1);
    q.append(minus, n, plus); c.append(q); g.append(c);
  });
  draw();
}
function draw() {
  const L = $("#lines"); L.replaceChildren(); let t = 0;
  MENU.forEach(m => { const q = CART[m.item] || 0; if (!q) return; t += q * m.price; const r = h("div", "line"); r.append(h("span", null, q + "× " + m.item), h("span", null, money(q * m.price))); L.append(r); });
  if (!t) L.append(h("div", "empty", "Add something tasty 👈"));
  $("#tot").textContent = money(t); $("#go").disabled = !t;
}
$("#fp").onclick = () => { FUL = "pickup"; $("#fp").classList.add("on"); $("#fd").classList.remove("on"); $("#addrl").hidden = true; };
$("#fd").onclick = () => { FUL = "delivery"; $("#fd").classList.add("on"); $("#fp").classList.remove("on"); $("#addrl").hidden = false; };
$("#pick").onchange = () => { BID = $("#pick").value; history.replaceState(null, "", "?business_id=" + encodeURIComponent(BID)); $("#ok").hidden = true; $("#form").hidden = false; load(); };
$("#go").onclick = async () => {
  $("#err").textContent = ""; $("#go").disabled = true;
  const cart = Object.entries(CART).filter(([, q]) => q > 0).map(([item, qty]) => ({ item, qty }));
  const r = await fetch("/api/shop/order", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ business_id: BID, cart, name: $("#name").value, phone: $("#phone").value, fulfilment: FUL, address: $("#addr").value, when: $("#when").value, note: $("#note").value }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("#err").textContent = d.error || "Could not place the order."; $("#go").disabled = false; return; }
  const o = d.order; $("#form").hidden = true; const ok = $("#ok"); ok.hidden = false; ok.replaceChildren();
  ok.append(h("h3", null, "✅ Order sent!"), h("div", null, "Order " + o.id + " · " + money(o.total)),
    h("div", "small", o.items.map(i => i.qty + "× " + i.item).join(", ") + " · " + o.fulfilment + (o.when ? " " + o.when : "")),
    h("p", "small", "The seller sees it in BizFlow right away and will confirm. Pay on " + o.fulfilment + "."));
  const again = h("button", "go", "Order something else"); again.onclick = () => { ok.hidden = true; $("#form").hidden = false; $("#note").value = ""; load(); }; ok.append(again);
};
load();
</script>
</body>
</html>
