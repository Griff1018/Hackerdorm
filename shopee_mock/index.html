<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopee (demo) · UrbanNest Lifestyle</title>
<style>
:root{--or:#ee4d2d;--or2:#ff7337;--orbg:#fff1ec;--ink:#222;--muted:#757575;--line:#ececec;--bg:#f5f5f5;--ok:#26aa99;--bad:#d0011b}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif}
button{font:inherit;border:0;border-radius:2px;padding:8px 14px;background:var(--or);color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}button.ghost{background:#fff;color:var(--ink);border:1px solid #ddd}button.soft{background:var(--orbg);color:var(--or);border:1px solid var(--or)}
button.sm{padding:5px 10px;font-size:13px}button.link{background:none;color:var(--or);padding:0}
input,select,textarea{font:inherit;border:1px solid #ddd;border-radius:2px;padding:7px 9px;background:#fff}
.demo{background:#222;color:#ffd7cc;text-align:center;font-size:12px;padding:3px}
.top{background:linear-gradient(-180deg,#f53d2d,#f63);color:#fff}
.topin{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px}
.logo{font-size:26px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.logo small{font-size:13px;font-weight:400;border-left:1px solid #fff9;padding-left:8px}
.search{flex:1;display:flex;background:#fff;border-radius:2px;padding:3px}.search input{flex:1;border:0;outline:0}.search button{padding:6px 18px}
.toplinks{display:flex;gap:14px;align-items:center;white-space:nowrap}.toplinks a{color:#fff;text-decoration:none;cursor:pointer;font-size:14px}
.badge{background:#fff;color:var(--or);border-radius:10px;font-size:11px;font-weight:700;padding:0 6px;margin-left:3px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.05);padding:16px;margin-bottom:12px}
.shopban{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.shopav{width:76px;height:76px;border-radius:50%;background:var(--or);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center}
.shopstats{display:flex;gap:4px 26px;flex-wrap:wrap;color:var(--muted);margin-top:6px}.shopstats b{color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:10px}
.pc{background:#fff;border:1px solid transparent;cursor:pointer;display:flex;flex-direction:column;transition:transform .1s}
.pc:hover{border-color:var(--or);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pimg{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:70px;position:relative}
.pimg .tag{position:absolute;top:6px;left:0;background:var(--or);color:#fff;font-size:11px;padding:1px 6px}
.pimg .tag.boost{background:#ffb800;color:#222}
.pb{padding:8px}.pn{height:40px;overflow:hidden;font-size:13px;line-height:20px}
.pp{color:var(--or);font-size:16px;margin-top:6px;display:flex;justify-content:space-between;align-items:baseline}.pp small{color:var(--muted);font-size:12px}
.stars{color:#ffce3d;letter-spacing:1px}
.detail{display:grid;grid-template-columns:420px 1fr;gap:26px}.bigimg{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:170px;border-radius:2px}
.dprice{background:#fafafa;padding:14px 18px;font-size:28px;color:var(--or);margin:12px 0}.dprice s{color:#999;font-size:15px;margin-right:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{background:#fff;color:var(--ink);border:1px solid #ddd;padding:6px 12px}.opt.on{border-color:var(--or);color:var(--or)}.opt:disabled{color:#bbb}
.rowk{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin:12px 0;color:var(--muted)}
.desc{white-space:pre-wrap;line-height:1.7}
.rev{border-bottom:1px solid var(--line);padding:12px 0}.rev .who{font-size:12.5px;color:var(--muted)}.rev .rp{background:#fafafa;padding:8px;margin-top:6px;font-size:13px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow:auto}.tabs button{background:none;color:var(--ink);border-bottom:2px solid transparent;border-radius:0;padding:14px 18px;white-space:nowrap}
.tabs button.on{color:var(--or);border-bottom-color:var(--or)}
.order{background:#fff;margin-bottom:10px}.ohead{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
.ostat{color:var(--or);text-transform:uppercase;font-size:13px}.oline{display:flex;gap:12px;padding:10px 16px;align-items:center}.oimg{width:56px;height:56px;font-size:30px;display:flex;align-items:center;justify-content:center;background:#fafafa}
.ofoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.track{padding:6px 16px 12px;font-size:12.5px;color:var(--muted)}.track div{padding:2px 0 2px 14px;border-left:2px solid #ddd}.track div:first-child{color:var(--ok);border-left-color:var(--ok)}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto}
.chatwin{position:fixed;right:20px;bottom:0;width:360px;height:470px;background:#fff;box-shadow:0 0 14px #0003;display:flex;flex-direction:column;z-index:40;border-radius:4px 4px 0 0}
.chathd{background:var(--or);color:#fff;padding:10px 12px;display:flex;justify-content:space-between}
.msgs{flex:1;overflow:auto;padding:10px;background:#f7f7f7;display:flex;flex-direction:column;gap:6px}
.bub{max-width:80%;padding:7px 10px;border-radius:8px;font-size:13px;background:#fff;align-self:flex-start;white-space:pre-wrap}.bub.me{background:#ffe6dd;align-self:flex-end}
.bub small{display:block;color:#999;font-size:10.5px;margin-top:2px}.bub.card2{background:#fff7e6;border:1px dashed #f5a623}
.chatin{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}.chatin input{flex:1}
/* Seller Centre */
.sc{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 80px)}
.scnav{background:#fff;border-right:1px solid var(--line);padding:12px 0}.scnav button{display:flex;justify-content:space-between;width:100%;background:none;color:var(--ink);text-align:left;padding:10px 18px;border-radius:0}
.scnav button.on{color:var(--or);background:var(--orbg);border-right:3px solid var(--or)}.scnav .n{background:var(--or);color:#fff;border-radius:9px;font-size:11px;padding:0 6px}
.scmain{padding:16px 20px;overflow:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.kpi{background:#fff;padding:12px 14px;border-radius:3px}.kpi b{font-size:22px;display:block}.kpi span{color:var(--muted);font-size:12.5px}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
table{width:100%;border-collapse:collapse;background:#fff}th{background:#fafafa;text-align:left;font-weight:600;color:var(--muted);font-size:12.5px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:9px;background:#f0f0f0}.pill.red{background:#fde8e8;color:var(--bad)}.pill.or{background:var(--orbg);color:var(--or)}.pill.ok{background:#e6f7f4;color:var(--ok)}
.bars{display:flex;gap:4px;align-items:flex-end;height:120px;padding-top:6px}.bars div{flex:1;background:var(--or2);border-radius:2px 2px 0 0;position:relative;min-height:2px}
.bars div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:#999}
.feed{max-height:330px;overflow:auto;font-size:12.5px}.feed div{padding:5px 0;border-bottom:1px solid #f3f3f3}
.chatgrid{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 140px);background:#fff}.clist{border-right:1px solid var(--line);overflow:auto}
.ci{padding:10px 12px;border-bottom:1px solid #f3f3f3;cursor:pointer}.ci.on{background:var(--orbg)}.ci .l{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cthread{display:flex;flex-direction:column}.small{color:var(--muted);font-size:12.5px}.err{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:4px;z-index:60}
.search{min-width:0}
@media(max-width:820px){.detail,.sc,.chatgrid{grid-template-columns:1fr}.scnav{display:flex;overflow:auto;padding:0}.scnav button{width:auto;white-space:nowrap}
  .topin{flex-wrap:wrap;gap:10px}.search{order:3;flex-basis:100%}.toplinks{flex-wrap:wrap;gap:10px;font-size:13px}.chatwin{width:100%;right:0}
  .logo{font-size:22px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.bigimg{font-size:110px}.chatgrid{height:auto}.clist{max-height:240px}}
</style>
</head>
<body>
<div class="demo">DEMO Shopee — a simulated marketplace connected to Enterprise Buddy. Synthetic shop, buyers and orders; no real money moves.</div>
<div class="top"><div class="topin">
  <div class="logo" id="logo">🛍️ Shopee <small id="modelabel">Storefront</small></div>
  <div class="search" id="searchbox"><input id="q" placeholder="Search in UrbanNest Lifestyle"><button id="qgo">🔍</button></div>
  <div class="toplinks">
    <a id="lnkorders">My Orders</a><a id="lnkcart">🛒 Cart<span class="badge" id="cartn">0</span></a><a id="lnkchat">💬 Chat</a>
    <a id="lnkmode">🏪 Seller Centre</a>
  </div>
</div></div>
<div id="app"></div>
<div id="chatwin" class="chatwin" hidden></div>
<div id="modal" class="modal" hidden></div>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const rm = v => "RM" + (+v).toFixed(2);
const stars = r => "★".repeat(Math.round(r)) + "☆".repeat(5 - Math.round(r));
const when = ts => new Date(ts * 1000).toLocaleString("en-MY", { timeZone: "Asia/Kuala_Lumpur", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
async function api(path, body) {
  const r = await fetch("/api/shopee" + path, body !== undefined ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const d = await r.json(); if (!r.ok || d.error) throw new Error(d.error || r.statusText); return d;
}
function toast(t) { const d = el("div", "toast", t); document.body.append(d); setTimeout(() => d.remove(), 2600); }
function modal(title, body) { const m = $("#modal"), c = el("div", "card"); const h = el("div"); h.style.cssText = "display:flex;justify-content:space-between;margin-bottom:10px";
  const x = el("button", "ghost sm", "✕"); x.onclick = () => m.hidden = true; h.append(el("b", null, title), x); c.append(h, body); m.replaceChildren(c); m.hidden = false; }
$("#modal").onclick = e => { if (e.target.id === "modal") $("#modal").hidden = true; };
const CART = JSON.parse(localStorage.getItem("shopee.cart") || "[]"); const saveCart = () => { localStorage.setItem("shopee.cart", JSON.stringify(CART)); $("#cartn").textContent = CART.reduce((a, c) => a + c.qty, 0); };
const STATUS_TXT = { UNPAID: "To pay", READY_TO_SHIP: "To ship", IN_CANCEL: "Cancellation requested", PROCESSED: "To receive — packed", SHIPPED: "To receive — in transit", TO_CONFIRM_RECEIVE: "Delivered — confirm receipt", COMPLETED: "Completed", CANCELLED: "Cancelled", TO_RETURN: "Return / refund" };

// ------------------------------------------------------------------ router
function route() {
  const h = location.hash || "#store";
  const seller = h.startsWith("#seller");
  $("#modelabel").textContent = seller ? "Seller Centre" : "Storefront"; $("#lnkmode").textContent = seller ? "🛍️ Storefront" : "🏪 Seller Centre";
  $("#searchbox").hidden = seller;
  ["#lnkorders", "#lnkcart", "#lnkchat"].forEach(x => $(x).hidden = seller);
  if (seller) return seller_(h.split("/")[1] || "dashboard");
  const [, page, arg] = h.split("/");
  if (h.startsWith("#item")) return itemPage(page);
  if (h === "#orders") return ordersPage();
  if (h === "#cart") return cartPage();
  return home();
}
window.onhashchange = route;
$("#logo").onclick = () => location.hash = location.hash.startsWith("#seller") ? "#seller" : "#store";
$("#lnkmode").onclick = () => location.hash = location.hash.startsWith("#seller") ? "#store" : "#seller";
$("#lnkorders").onclick = () => location.hash = "#orders"; $("#lnkcart").onclick = () => location.hash = "#cart"; $("#lnkchat").onclick = () => openChat();
$("#qgo").onclick = () => { location.hash = "#store"; home($("#q").value); }; $("#q").onkeydown = e => { if (e.key === "Enter") $("#qgo").click(); };

// ------------------------------------------------------------------ storefront
async function home(q) {
  const app = $("#app"), w = el("div", "wrap"); app.replaceChildren(w);
  const d = await api("/store/home" + (q ? "?q=" + encodeURIComponent(q) : ""));
  const ban = el("div", "card shopban");
  const av = el("div", "shopav", "🏠"), info = el("div"); info.style.flex = "1";
  info.append(el("h2", null, d.shop.shop_name), el("div", "small", d.shop.description));
  const st = el("div", "shopstats"); [["Rating", d.rating.rating_star + " (" + (d.rating.rating_count / 1000).toFixed(1) + "k)"], ["Followers", (d.shop.follower_count / 1000).toFixed(1) + "k"], ["Products", d.items.length], ["Ships from", d.shop.location]]
    .forEach(([k, v]) => { const s = el("div"); s.append(k + ": ", el("b", null, v)); st.append(s); });
  info.append(st);
  const chat = el("button", "soft", "💬 Chat now"); chat.onclick = () => openChat();
  ban.append(av, info, chat); w.append(ban);
  w.append(el("h3", null, q ? "Results for “" + q + "”" : "ALL PRODUCTS"));
  const g = el("div", "grid");
  d.items.forEach(it => g.append(productCard(it)));
  if (!d.items.length) w.append(el("div", "card", "No products found."));
  w.append(g);
}
function productCard(it) {
  const c = el("div", "pc"); c.onclick = () => location.hash = "#item/" + it.item_id;
  const img = el("div", "pimg", it.emoji); img.style.background = it.color + "33";
  if (it.boosted) img.append(el("span", "tag boost", "BOOSTED"));
  else if (it.original_max > it.price_min) img.append(el("span", "tag", "-" + Math.round((1 - it.price_min / it.original_max) * 100) + "%"));
  const b = el("div", "pb"); b.append(el("div", "pn", it.name));
  const p = el("div", "pp"); p.append(el("span", null, rm(it.price_min)), el("small", null, (it.sold >= 1000 ? (it.sold / 1000).toFixed(1) + "k" : it.sold) + " sold"));
  b.append(p, el("div", "small", stars(it.rating) + " " + it.rating)); if (!it.stock) b.append(el("div", "pill red", "Sold out"));
  c.append(img, b); return c;
}
async function itemPage(id) {
  const app = $("#app"), w = el("div", "wrap"); app.replaceChildren(w);
  const it = await api("/store/item/" + id);
  const c = el("div", "card detail");
  const img = el("div", "bigimg", it.emoji); img.style.background = it.color + "33";
  const r = el("div"); r.append(el("h2", null, it.name));
  r.append(el("div", "small", stars(it.rating) + " " + it.rating + " · " + it.rating_count.toLocaleString() + " ratings · " + it.sold.toLocaleString() + " sold"));
  let model = it.models.find(m => m.stock > 0) || it.models[0], qty = 1;
  const price = el("div", "dprice");
  const showPrice = () => { price.replaceChildren(); if (model.original_price > model.price) price.append(el("s", null, rm(model.original_price))); price.append(rm(model.price)); stockLbl.textContent = model.stock + " pieces available"; };
  const stockLbl = el("span", "small");
  const opts = el("div", "opts");
  it.models.forEach(m => { const b = el("button", "opt" + (m === model ? " on" : ""), m.model_name); b.disabled = !m.stock; b.onclick = () => { model = m; opts.querySelectorAll(".opt").forEach(x => x.classList.remove("on")); b.classList.add("on"); showPrice(); }; opts.append(b); });
  const q = el("input"); q.type = "number"; q.min = 1; q.value = 1; q.style.width = "80px"; q.oninput = () => qty = Math.max(1, +q.value || 1);
  const rk = (k, v) => { const d = el("div", "rowk"); d.append(el("span", null, k), v); return d; };
  const qrow = el("div"); qrow.append(q, " ", stockLbl);
  const btns = el("div"); btns.style.cssText = "display:flex;gap:10px;margin-top:14px";
  const add = el("button", "soft", "🛒 Add to cart"), buy = el("button", null, "Buy now");
  const addToCart = () => { const ex = CART.find(c => c.model_id === model.model_id); if (ex) ex.qty += qty; else CART.push({ model_id: model.model_id, item_id: it.item_id, name: it.name, model: model.model_name, price: model.price, emoji: it.emoji, qty }); saveCart(); };
  add.onclick = () => { addToCart(); toast("Added to cart"); }; buy.onclick = () => { addToCart(); location.hash = "#cart"; };
  if (!it.stock) { add.disabled = buy.disabled = true; }
  btns.append(add, buy);
  r.append(price, rk("Shipping", el("span", null, "Free shipping above RM30 · ships from " + "Shah Alam")), rk(it.tiers.map(t => t.name).join(" / ") || "Variation", opts), rk("Quantity", qrow), btns);
  showPrice(); c.append(img, r); w.append(c);
  const d = el("div", "card"); d.append(el("h3", null, "PRODUCT SPECIFICATIONS"));
  Object.entries(it.attributes).forEach(([k, v]) => d.append((() => { const x = el("div", "rowk"); x.append(el("span", null, k), el("span", null, v)); return x; })()));
  d.append(el("h3", null, "PRODUCT DESCRIPTION"), el("div", "desc", it.description || "—")); w.append(d);
  const rv = el("div", "card"); rv.append(el("h3", null, "PRODUCT RATINGS"));
  const hd = el("div", "small"); hd.append(it.rating + " out of 5 · " + it.rating_by_star.map((n, i) => (i + 1) + "★ " + n).reverse().join(" · ")); rv.append(hd);
  it.reviews.forEach(x => { const e = el("div", "rev"); e.append(el("div", "who", x.buyer_username + " · " + when(x.create_time)), el("div", "stars", stars(x.rating_star)), el("div", null, x.comment || "(no text)"));
    if (x.reply) e.append(el("div", "rp", "Seller's response: " + x.reply)); rv.append(e); });
  if (!it.reviews.length) rv.append(el("div", "small", "No reviews yet."));
  w.append(rv);
}
function cartPage() {
  const app = $("#app"), w = el("div", "wrap"); app.replaceChildren(w);
  const c = el("div", "card"); c.append(el("h2", null, "Shopping Cart")); w.append(c);
  if (!CART.length) { c.append(el("div", "small", "Your cart is empty.")); return; }
  const t = el("table"), hr = el("tr"); ["Product", "Unit price", "Qty", "Total", ""].forEach(x => hr.append(el("th", null, x))); t.append(hr);
  CART.forEach((x, i) => { const tr = el("tr"); const q = el("input"); q.type = "number"; q.min = 1; q.value = x.qty; q.style.width = "64px"; q.onchange = () => { x.qty = Math.max(1, +q.value || 1); saveCart(); cartPage(); };
    const del = el("button", "ghost sm", "Delete"); del.onclick = () => { CART.splice(i, 1); saveCart(); cartPage(); };
    [x.emoji + " " + x.name.slice(0, 60) + " — " + x.model, rm(x.price)].forEach(v => tr.append(el("td", null, v))); const tq = el("td"); tq.append(q); tr.append(tq, el("td", null, rm(x.price * x.qty)));
    const td = el("td"); td.append(del); tr.append(td); t.append(tr); });
  c.append(t);
  const sub = CART.reduce((a, x) => a + x.price * x.qty, 0), ship = sub >= 30 ? 0 : 4.9;
  const pay = el("select"); ["ShopeePay", "Online Banking", "Credit/Debit Card", "Cash on Delivery", "SPayLater"].forEach(p => pay.append(el("option", null, p)));
  const msg = el("input"); msg.placeholder = "Message to seller (optional)"; msg.style.flex = "1";
  const f = el("div", "ofoot"); const s = el("div"); s.append(el("div", null, "Merchandise subtotal: " + rm(sub)), el("div", "small", "Shipping: " + (ship ? rm(ship) : "FREE (above RM30)")), el("b", null, "Total: " + rm(sub + ship)));
  const place = el("button", null, "Place Order");
  place.onclick = async () => { place.disabled = true; try { const o = await api("/store/checkout", { lines: CART.map(x => ({ model_id: x.model_id, quantity: x.qty })), payment_method: pay.value, message: msg.value }); CART.length = 0; saveCart(); toast("Order " + o.order_sn + " placed!"); location.hash = "#orders"; } catch (e) { alert(e.message); place.disabled = false; } };
  const opts = el("div"); opts.style.cssText = "display:flex;gap:8px;flex:1;flex-wrap:wrap"; opts.append(pay, msg);
  f.append(opts, s, place); c.append(f);
}
async function ordersPage() {
  const app = $("#app"), w = el("div", "wrap"); app.replaceChildren(w);
  w.append(el("h2", null, "My Purchases (demo_buyer)"));
  const d = await api("/store/orders");
  if (!d.orders.length) w.append(el("div", "card", "No orders yet — buy something from the shop!"));
  d.orders.forEach(o => {
    const c = el("div", "order");
    const h = el("div", "ohead"); h.append(el("span", null, "UrbanNest Lifestyle · " + o.order_sn + " · " + when(o.create_time)), el("span", "ostat", STATUS_TXT[o.order_status] || o.order_status)); c.append(h);

  [[1, "+1 hour"], [6, "+6 hours"], [24, "+1 day"]].forEach(([h, l]) => { const b = el("button", "soft sm", "⏩ " + l); b.onclick = async () => { b.disabled = true; await post({ advance_hours: h }, "Fast-forwarded " + l); }; row.append(b); });
  c.append(row); main.append(c);
  const sc = el("div", "card"); sc.append(el("b", null, "Live scenarios"));
  s.scenarios.forEach(x => { const r = el("div"); r.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f3f3";
    const tx = el("div"); tx.append(el("b", null, x.title), el("div", "small", x.description)); const b = el("button", "sm", "Run"); b.onclick = () => post({ scenario: x.id }, x.title + " started"); r.append(tx, b); sc.append(r); });
  if (s.modifiers.length) sc.append(el("div", "small", "Active: " + s.modifiers.map(m => m.label).join(" · ")));
  main.append(sc);
  const pl = el("div", "card"); pl.append(el("b", null, "Planted problems (answer key)"), el("div", "small", "The agent has to discover these from data alone."));
  const ul = el("ul"); s.planted.forEach(p => ul.append(el("li", null, p.problem))); pl.append(ul); main.append(pl);
  const rs = el("button", "ghost", "♻ Reset shop world to the 60-day demo history"); rs.onclick = () => confirm("Reset the whole shop world?") && post({ reset: true }, "Shop reset");
  main.append(rs);
}
// keep Seller Centre fresh while it is open (skip when typing)
setInterval(() => { const h = location.hash; if ((h === "#seller" || h.startsWith("#seller/dashboard")) && !document.querySelector("input:focus, textarea:focus") && $("#modal").hidden) route(); }, 15000);
saveCart(); route();
</script>
