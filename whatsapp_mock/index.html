<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Business (demo)</title>
  <!-- UI adapted from the team's demoWhatsapp mock; conversations now live in BizFlow (Messages) and BizFlow's agent replies. -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { wa: { green: "#00a884", dark: "#008069", bubble: "#d9fdd3", gray: "#ffffff", panel: "#f0f2f5", chat: "#efeae2", text: "#111b21", muted: "#667781", tick: "#53bdeb" } } } } };
  </script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    body { background-color: #f0f2f5; color: #111b21; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .thin-scroll::-webkit-scrollbar { width: 6px; } .thin-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,.2); }
    .wa-wallpaper { background-color: #efeae2; background-image: radial-gradient(rgba(0,0,0,.035) 1.5px, transparent 1.5px), radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px);
      background-size: 26px 26px, 13px 13px; background-position: 0 0, 6px 6px; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    .msg-in { animation: msgIn .25s ease-out; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    .dot { animation: blink 1.2s infinite; } .dot:nth-child(2) { animation-delay: .2s; } .dot:nth-child(3) { animation-delay: .4s; }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const qs = new URLSearchParams(location.search);
    const rm = n => `RM${Number(n || 0).toFixed(2)}`;
    const AVATAR = ["bg-emerald-500", "bg-sky-500", "bg-violet-500", "bg-rose-500", "bg-amber-500", "bg-teal-500", "bg-indigo-500", "bg-pink-500"];
    const colorOf = s => AVATAR[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % AVATAR.length];
    const initials = name => String(name).replace(/\(.*?\)/g, "").trim().split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "?";
    const clock = ts => new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const lastTs = c => c.messages.length ? c.messages[c.messages.length - 1].ts : "";
    function dayLabel(ts) {
      const d = new Date(ts), today = new Date();
      const days = Math.round((new Date(today.toDateString()) - new Date(d.toDateString())) / 864e5);
      return days === 0 ? "Today" : days === 1 ? "Yesterday" : days < 7 ? d.toLocaleDateString([], { weekday: "long" }) : d.toLocaleDateString();
    }
    const listTime = ts => !ts ? "" : dayLabel(ts) === "Today" ? clock(ts) : dayLabel(ts);
    const SENDER = { auto: ["BizFlow AI agent", "text-emerald-700"], owner: ["You (sent from BizFlow)", "text-sky-700"], bizflow: ["BizFlow · supplier order", "text-violet-700"] };

    function WAText({ text }) {
      return String(text).split(/(\*[^*\n]+\*|_[^_\n]+_)/g).map((p, i) =>
        /^\*[^*]+\*$/.test(p) ? <strong key={i}>{p.slice(1, -1)}</strong> : /^_[^_]+_$/.test(p) ? <em key={i}>{p.slice(1, -1)}</em> : p);
    }
    function Icon({ name, size = 20, className = "" }) {
      const node = window.lucide?.icons?.[name]; const kids = node ? (node[0] === "svg" ? node[2] : node) : [];
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" className={`shrink-0 ${className}`}>
        {kids.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}</svg>;
    }
    function Avatar({ chat, size = "w-12 h-12", text = "text-base" }) {
      return <div className={`${size} ${chat.kind === "supplier" ? "bg-slate-600" : colorOf(chat.phone)} ${text} rounded-full text-white font-semibold flex items-center justify-center shrink-0`}>
        {chat.kind === "supplier" ? <Icon name="Truck" size={18} /> : initials(chat.name)}</div>;
    }
    async function api(path, body) {
      const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "HTTP " + r.status); return j;
    }

    function App() {
      const [bid, setBid] = useState(qs.get("business_id") || "campus-crumb");
      const [shops, setShops] = useState([]);
      const [data, setData] = useState({ business: {}, chats: [], menu: [], connected: true });
      const [activeId, setActiveId] = useState(qs.get("chat"));
      const [mobileChat, setMobileChat] = useState(!!qs.get("chat"));
      const [input, setInput] = useState("");
      const [search, setSearch] = useState("");
      const [filter, setFilter] = useState("all");
      const [waiting, setWaiting] = useState({});
      const [hub, setHub] = useState(false);
      const endRef = useRef(null);

      const load = async () => { try { setData(await api("/api/whatsapp/chats?business_id=" + encodeURIComponent(bid))); } catch {} };
      useEffect(() => { load(); const t = setInterval(load, 2500); return () => clearInterval(t); }, [bid]);
      useEffect(() => { api("/api/shop/info?business_id=" + encodeURIComponent(bid)).then(d => setShops(d.shops || [])).catch(() => {}); }, [bid]);
      const active = data.chats.find(c => c.id === activeId);
      useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [active?.messages.length, activeId, waiting[activeId]]);
      useEffect(() => {  // stop the "typing" indicator once BizFlow answered
        const w = { ...waiting }; let ch = false;
        Object.keys(w).forEach(id => { const c = data.chats.find(x => x.id === id); if (!c || (c.messages.length && c.messages[c.messages.length - 1].from === "a") || Date.now() - w[id] > 90000) { delete w[id]; ch = true; } });
        if (ch) setWaiting(w);
      }, [data]);

      async function sendAs(chat, text) {
        const r = await api("/api/channels/whatsapp/incoming", { business_id: bid, contact: { handle: chat.phone, name: chat.name }, text, auto_new: true });
        if (chat.kind !== "supplier") setWaiting(w => ({ ...w, [r.thread_id]: Date.now() }));
        await load(); return r.thread_id;
      }
      async function send(e) {
        e?.preventDefault(); const text = input.trim(); if (!text || !active) return;
        setInput(""); await sendAs(active, text);
      }
      async function newChat() {
        const name = prompt("Customer name (demo)", "Nadia (demo)"); if (!name) return;
        const phone = prompt("Phone number", "6012" + Math.floor(1000000 + Math.random() * 8999999)); if (!phone) return;
        const first = prompt("First message from the customer", examples()[0].text); if (!first) return;
        const tid = await sendAs({ phone: phone.replace(/\D/g, ""), name, kind: "customer" }, first);
        setActiveId(tid); setMobileChat(true);
      }
      const examples = () => {
        const m = data.menu || [], a = (m[0] || {}).item || "your best seller", b = (m[1] || {}).item || a;
        return [{ label: "Order", text: `Hi! Can I order 2 ${a} and 1 ${b} for pickup at 3pm today?` },
                { label: "Question", text: "What time are you open tomorrow? Can I pay with Touch 'n Go?" },
                { label: "Complaint", text: `My ${a} yesterday was not fresh. Quite disappointed.` },
                { label: "Suggestion", text: "You should do a combo set for students!" }];
      };
      const supplierPrompts = [{ label: "Confirm", text: "Received, thanks! We can deliver on Thursday morning." }, { label: "Out of stock", text: "Sorry, this item is out of stock until next week. Can we send an alternative?" }];

      const q = search.trim().toLowerCase();
      const visible = data.chats.filter(c => !q || c.name.toLowerCase().includes(q) || c.messages.some(m => m.text.toLowerCase().includes(q)))
        .filter(c => filter === "all" || (filter === "unread" ? c.unread > 0 : filter === "suppliers" ? c.kind === "supplier" : filter === "orders" ? c.orders.length : c.kind !== "supplier"));
      const rows = []; active?.messages.forEach((m, i) => { const d = dayLabel(m.ts); if (i === 0 || dayLabel(active.messages[i - 1].ts) !== d) rows.push({ sep: d, key: "s" + m.id }); rows.push(m); });
      const allOrders = data.chats.flatMap(c => c.orders.map(o => ({ ...o, customer: c.name, chatId: c.id })));
      const supplierChats = data.chats.filter(c => c.kind === "supplier");

      return (
        <div className="h-screen w-full flex overflow-hidden bg-wa-panel">
          <section className={`${mobileChat ? "hidden md:flex" : "flex"} w-full md:w-[360px] lg:w-[400px] shrink-0 flex-col bg-white border-r border-slate-200`}>
            <header className="h-[60px] px-4 bg-wa-panel flex items-center justify-between shrink-0">
              <div className="flex items-center gap-3 min-w-0">
                <div className="w-10 h-10 rounded-full bg-wa-dark text-white flex items-center justify-center"><Icon name="Store" size={20} /></div>
                <div className="min-w-0">
                  <select value={bid} onChange={e => { setBid(e.target.value); setActiveId(null); history.replaceState(null, "", "?business_id=" + e.target.value); }} className="font-medium bg-transparent outline-none max-w-[210px] truncate">
                    {(shops.length ? shops : [{ id: bid, name: data.business.name || bid }]).map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                  <div className="text-[11px] text-wa-muted">WhatsApp Business · replies by BizFlow {data.connected ? "" : "(disconnected)"}</div>
                </div>
              </div>
              <div className="flex items-center gap-1 text-wa-muted">
                <button onClick={newChat} className="p-2 rounded-full hover:bg-black/5" title="New customer chat"><Icon name="MessageSquarePlus" size={20} /></button>
                <button onClick={() => setHub(!hub)} className={`p-2 rounded-full hover:bg-black/5 ${hub ? "text-wa-dark bg-black/5" : ""}`} title="Orders captured"><Icon name="Receipt" size={20} /></button>
              </div>
            </header>
            <div className="px-3 pt-2 pb-1"><div className="flex items-center gap-3 bg-wa-panel rounded-lg px-3 h-9">
              <Icon name="Search" size={16} className="text-wa-muted" />
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search chats" className="bg-transparent text-sm outline-none w-full placeholder-wa-muted" />
            </div></div>
            <div className="flex gap-2 px-3 py-2 overflow-x-auto no-scrollbar">
              {[["all", "All"], ["unread", "Unread"], ["customers", "Customers"], ["orders", "Orders"], ["suppliers", "Suppliers"]].map(([id, label]) => (
                <button key={id} onClick={() => setFilter(id)} className={`text-sm whitespace-nowrap rounded-full px-3 py-1 ${filter === id ? "bg-emerald-100 text-wa-dark font-medium" : "bg-wa-panel text-wa-muted hover:bg-slate-200"}`}>{label}</button>))}
            </div>
            <ul className="flex-1 overflow-y-auto thin-scroll">
              {visible.map(chat => { const last = chat.messages[chat.messages.length - 1]; return (
                <li key={chat.id} onClick={() => { setActiveId(chat.id); setMobileChat(true); }} className={`flex items-center gap-3 pl-3 pr-4 cursor-pointer ${chat.id === activeId ? "bg-[#f0f2f5]" : "hover:bg-[#f5f6f6]"}`}>
                  <Avatar chat={chat} />
                  <div className="flex-1 min-w-0 border-b border-slate-100 py-3">
                    <div className="flex items-center justify-between gap-2"><span className="font-medium truncate">{chat.name}</span>
                      <span className={`text-xs shrink-0 ${chat.unread ? "text-wa-green font-medium" : "text-wa-muted"}`}>{listTime(lastTs(chat))}</span></div>
                    <div className="flex items-center justify-between gap-2 mt-0.5">
                      <span className="text-sm text-wa-muted truncate flex items-center gap-1">
                        {waiting[chat.id] ? <span className="text-wa-green">typing…</span> : <>{last?.from === "a" && <Icon name="CheckCheck" size={16} className="text-wa-tick" />}<span className="truncate">{(last?.text || "").replace(/\*/g, "").split("\n")[0]}</span></>}
                      </span>
                      <span className="flex items-center gap-1 shrink-0">
                        {chat.kind === "supplier" && <span className="text-[10px] bg-slate-100 text-slate-600 rounded px-1.5">supplier</span>}
                        {chat.auto_reply && <span className="text-[10px] bg-emerald-50 text-emerald-700 rounded px-1.5">AI</span>}
                        {chat.unread > 0 && <span className="bg-wa-green text-white text-[11px] font-semibold rounded-full min-w-[20px] h-5 px-1.5 flex items-center justify-center">{chat.unread}</span>}
                      </span>
                    </div>
                  </div>
                </li>); })}
              {!visible.length && <li className="text-center text-sm text-wa-muted py-10 px-6">No chats yet. Tap <b>new chat</b> to message this business as a customer.</li>}
            </ul>
          </section>

          <section className={`${mobileChat ? "flex" : "hidden md:flex"} flex-1 min-w-0 flex-col`}>
            {active ? (<>
              <header className="h-[60px] px-4 bg-wa-panel flex items-center gap-3 shrink-0 border-l border-slate-200">
                <button onClick={() => setMobileChat(false)} className="md:hidden p-1 -ml-1"><Icon name="ArrowLeft" size={22} /></button>
                <Avatar chat={active} size="w-10 h-10" text="text-sm" />
                <div className="flex-1 min-w-0"><div className="font-medium leading-tight truncate">{active.name}</div>
                  <div className="text-xs text-wa-muted truncate">{waiting[active.id] ? <span className="text-wa-green">BizFlow is replying…</span> : `+${active.phone} · ${active.kind}` + (active.auto_reply ? " · AI auto-reply on" : active.kind === "supplier" ? "" : " · owner replies from BizFlow")}</div></div>
              </header>
              <div className="flex-1 overflow-y-auto thin-scroll wa-wallpaper px-3 sm:px-[6%] py-3">
                <div className="flex justify-center mb-3"><span className="text-[11px] text-center bg-[#ffeecd] text-[#54656f] rounded-lg px-3 py-1.5 max-w-md flex items-start gap-1.5">
                  <Icon name="Lock" size={12} className="mt-0.5" /> Demo: type as the {active.kind} (left). Replies on the right come from {data.business.name} via BizFlow.</span></div>
                {rows.map(r => r.sep ? <div key={r.key} className="flex justify-center my-3"><span className="text-[11px] uppercase bg-white text-wa-muted rounded-md px-3 py-1 shadow-sm">{r.sep}</span></div>
                  : r.from === "c" ? (
                  <div key={r.id} className="flex justify-start mb-1.5 msg-in"><div className="relative max-w-[85%] sm:max-w-[65%] bg-white rounded-lg rounded-tl-none px-2.5 pt-1.5 pb-1 shadow-sm">
                    <div className="text-[14.2px] leading-[19px] whitespace-pre-wrap break-words pr-12"><WAText text={r.text} /></div>
                    <div className="text-[11px] text-wa-muted text-right -mt-3 leading-none">{clock(r.ts)}</div></div></div>
                  ) : (
                  <div key={r.id} className="flex flex-col items-end mb-1.5 msg-in"><div className="relative max-w-[85%] sm:max-w-[65%] bg-wa-bubble rounded-lg rounded-tr-none px-2.5 pt-1 pb-1 shadow-sm">
                    <div className={`text-[11.5px] font-semibold ${(SENDER[r.by] || SENDER.owner)[1]}`}>{(SENDER[r.by] || SENDER.owner)[0]}</div>
                    <div className="text-[14.2px] leading-[19px] whitespace-pre-wrap break-words pr-14"><WAText text={r.text} /></div>
                    <div className="text-[11px] text-wa-muted text-right -mt-3 leading-none flex items-center justify-end gap-0.5">{clock(r.ts)} <Icon name="CheckCheck" size={15} className="text-wa-tick" /></div></div></div>))}
                {active.orders.map(o => <div key={o.id} className="flex justify-end mb-2"><span className="inline-flex items-center gap-1.5 text-[11px] font-medium bg-white border border-black/5 rounded-full px-2.5 py-1">
                  <Icon name="Receipt" size={12} /> Order {o.id} · {rm(o.total)} · <span className={`rounded-full px-1.5 ${o.status === "done" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"}`}>{o.status === "pending" ? "in BizFlow Orders" : o.status}</span></span></div>)}
                {waiting[active.id] && <div className="flex justify-end mb-1.5"><div className="bg-wa-bubble rounded-lg rounded-tr-none px-3 py-2.5 shadow-sm flex items-center gap-2">
                  <span className="text-[11px] text-wa-dark font-medium">{active.auto_reply ? "BizFlow AI agent is replying" : "Waiting for the owner in BizFlow"}</span>
                  <span className="flex gap-1">{[0, 1, 2].map(i => <span key={i} className="dot w-1.5 h-1.5 rounded-full bg-wa-dark" />)}</span></div></div>}
                <div ref={endRef} />
              </div>
              <div className="bg-wa-panel px-3 pt-2 flex gap-2 overflow-x-auto no-scrollbar border-l border-slate-200">
                {(active.kind === "supplier" ? supplierPrompts : examples()).map(p => <button key={p.label} onClick={() => setInput(p.text)} className="text-xs whitespace-nowrap bg-white hover:bg-emerald-50 border border-slate-200 rounded-full px-3 py-1 text-wa-muted hover:text-wa-dark">{p.label}</button>)}
              </div>
              <form onSubmit={send} className="bg-wa-panel px-3 py-2 flex items-center gap-2 border-l border-slate-200">
                <input value={input} onChange={e => setInput(e.target.value)} placeholder={`Type as ${active.name.split(" ")[0]} (${active.kind})…`} className="flex-1 min-w-0 bg-white rounded-lg px-4 py-2.5 text-[15px] outline-none placeholder-wa-muted" />
                <button type="submit" disabled={!input.trim()} className="w-11 h-11 rounded-full bg-wa-green hover:bg-wa-dark disabled:bg-transparent disabled:text-wa-muted text-white flex items-center justify-center"><Icon name="SendHorizontal" size={20} /></button>
              </form>
            </>) : (
              <div className="flex-1 flex flex-col items-center justify-center text-center px-8 bg-[#f8f9fa] border-l border-slate-200">
                <div className="w-20 h-20 rounded-full bg-emerald-100 text-wa-dark flex items-center justify-center"><Icon name="Bot" size={40} /></div>
                <h2 className="text-2xl font-light mt-5">WhatsApp Business · {data.business.name}</h2>
                <p className="text-sm text-wa-muted mt-2 max-w-md">Every chat here is also in BizFlow → Messages. Customers get BizFlow's AI auto-reply (orders go to BizFlow Orders); supplier orders sent from BizFlow show up as supplier chats.</p>
                <button onClick={newChat} className="mt-5 bg-wa-green hover:bg-wa-dark text-white rounded-full px-5 py-2 text-sm font-medium">Start a customer chat</button>
              </div>)}
          </section>

          {hub && <aside className="w-full max-w-[360px] bg-white border-l border-slate-200 flex flex-col">
            <div className="h-[60px] px-4 bg-wa-panel flex items-center gap-3"><button onClick={() => setHub(false)} className="p-1.5 rounded-full hover:bg-black/5"><Icon name="X" /></button>
              <div><div className="font-medium">Captured by BizFlow</div><div className="text-xs text-wa-muted">orders from chats · supplier messages</div></div></div>
            <div className="flex-1 overflow-y-auto thin-scroll p-3 space-y-2">
              <div className="text-xs font-semibold text-wa-muted uppercase">Customer orders ({allOrders.length})</div>
              {allOrders.map(o => <button key={o.id} onClick={() => { setActiveId(o.chatId); setMobileChat(true); }} className="w-full text-left rounded-lg border border-slate-200 hover:border-wa-green p-3">
                <div className="flex justify-between text-xs"><b className="text-wa-dark">{o.id}</b><span>{o.status}</span></div>
                <div className="text-sm font-medium mt-1">{o.customer}</div>
                <div className="text-xs text-wa-muted">{(o.items || []).map(i => `${i.qty}× ${i.item}`).join(", ")}</div><div className="text-xs mt-1"><b>{rm(o.total)}</b></div></button>)}
              <div className="text-xs font-semibold text-wa-muted uppercase pt-3">Suppliers ({supplierChats.length})</div>
              {supplierChats.map(c => <button key={c.id} onClick={() => { setActiveId(c.id); setMobileChat(true); }} className="w-full text-left rounded-lg border border-slate-200 hover:border-wa-green p-3">
                <div className="text-sm font-medium">{c.name}</div><div className="text-xs text-wa-muted truncate">{(c.messages[c.messages.length - 1] || {}).text}</div></button>)}
            </div></aside>}
        </div>);
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
